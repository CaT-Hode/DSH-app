<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'"
    />
    <title>DSH App</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --surface: #fff;
        --text: #242b35;
        --muted: #6c7583;
        --line: #e2e6eb;
        --accent: #4d6bfe;
        --soft: #edf1ff;
        --bad: #b54730;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181b20;
          --surface: #20242b;
          --text: #e2e6ed;
          --muted: #9da7b5;
          --line: #343b46;
          --soft: #293452;
          --bad: #ffad96;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.6 system-ui,
          'Microsoft YaHei UI',
          sans-serif;
      }
      main {
        max-width: 1260px;
        margin: auto;
        padding: 30px 36px 44px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      p {
        margin: 5px 0;
      }
      .muted,
      small {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      button {
        border: 1px solid var(--line);
        background: var(--surface);
        color: inherit;
        border-radius: 7px;
        padding: 8px 13px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .primary {
        color: white;
        background: var(--accent);
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      nav {
        display: flex;
        gap: 8px;
        margin: 26px 0 20px;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        border: 0;
        background: transparent;
        border-radius: 0;
        padding: 10px 17px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      nav button[aria-selected='true'] {
        border-bottom-color: var(--accent);
        color: var(--text);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 18px 20px;
        margin: 12px 0;
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .row > div:first-child {
        min-width: 0;
      }
      code {
        font:
          12px/1.6 ui-monospace,
          Consolas,
          monospace;
        overflow-wrap: anywhere;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 5px;
        background: var(--soft);
        color: var(--accent);
        font-size: 12px;
        margin-right: 7px;
      }
      .warning {
        color: var(--bad);
      }
      .notice {
        border-left: 3px solid var(--accent);
        padding: 10px 14px;
        margin: 12px 0;
        background: var(--soft);
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      td pre {
        margin: 0;
      }
      .checks th:first-child {
        width: 62%;
      }
      .checks th:nth-child(2) {
        width: 18%;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.6 ui-monospace,
          Consolas,
          monospace;
        max-height: 380px;
        overflow: auto;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      #status {
        min-height: 25px;
        margin-top: 13px;
      }
      #error {
        padding: 10px 14px;
        border: 1px solid var(--bad);
        border-radius: 7px;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }
      #content {
        min-height: 300px;
      }
      .metrics {
        display: flex;
        gap: 24px;
        margin-top: 8px;
        color: var(--muted);
      }
      .metrics strong {
        color: var(--text);
      }
    </style>
    <script src="maintenance-ui.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="heading"></h1>
          <p class="muted" id="subtitle"></p>
        </div>
        <div class="actions"><button id="refresh"></button><button id="check" class="primary"></button></div>
      </header>
      <section id="recovery" hidden></section>
      <p id="status" role="status" class="muted"></p>
      <p id="error" role="alert" class="warning" hidden></p>
      <nav id="tabs" aria-label="Diagnostics"></nav>
      <section id="content"></section>
    </main>
  </body>
</html>
