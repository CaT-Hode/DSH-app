<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cost and usage — DSH</title>
  <style>
    /* Palette. Embedded in the app the parent copies its --dsh-app-* tokens and color-scheme onto this
       document, so those win; standalone every fallback follows the OS preference through light-dark(). */
    :root{
      color-scheme:light dark;
      --pg-s:light-dark(#ffffff,#181b21);--pg-t:light-dark(#1f2329,#e8eaef);--pg-m:light-dark(#667085,#98a1b0);
      --pg-a:light-dark(#7c5cd6,#b79bf0);--pg-w:light-dark(#b54708,#f0b67a);--pg-d:light-dark(#b4322a,#f0a9a2);
      --pg-surface:var(--dsh-app-surface,var(--pg-s));
      --pg-text:var(--dsh-app-text,var(--pg-t));
      --pg-muted:var(--dsh-app-muted,var(--pg-m));
      --pg-accent:var(--pg-a);--pg-warn:var(--dsh-app-warning,var(--pg-w));--pg-danger:var(--pg-d);
      --pg-border:var(--dsh-app-border,color-mix(in srgb,var(--pg-surface) 86%,var(--pg-text) 14%));
      --pg-bg:color-mix(in srgb,var(--pg-surface) 96%,#000);
      --pg-surface-2:color-mix(in srgb,var(--pg-surface) 90%,var(--pg-text) 10%);
      --pg-selected:color-mix(in srgb,var(--pg-surface) 80%,var(--pg-text) 20%);
      --pg-hover:var(--dsh-app-hover,color-mix(in srgb,var(--pg-surface) 92%,var(--pg-text) 8%));
      --pg-border-strong:color-mix(in srgb,var(--pg-border) 55%,var(--pg-text) 45%);
      --pg-shadow:light-dark(0 1px 2px rgba(16,24,40,.06),0 1px 2px rgba(0,0,0,.55));--pg-radius:14px;
      font:400 14px/1.5 var(--dsh-app-font,"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--pg-bg);color:var(--pg-text)}
    html[data-dsh-desktop-chrome] body{padding-top:38px}
    main{max-width:960px;margin:0 auto;padding:32px 36px 48px}
    header{display:flex;align-items:center;gap:18px;margin-bottom:22px}
    h1{font-size:21px;margin:0;font-weight:600;letter-spacing:-.2px}h2{font-size:13px;font-weight:550;margin:0 0 12px;letter-spacing:.01em}
    a{color:var(--pg-accent);text-decoration:none}a:hover{text-decoration:underline}
    .muted{color:var(--pg-muted)}.spacer{flex:1}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--pg-border);border-radius:var(--pg-radius);overflow:hidden;background:var(--pg-surface);box-shadow:var(--pg-shadow)}
    .card{padding:22px 24px;border:0;border-radius:0;background:transparent}.card+.card{border-left:1px solid var(--pg-border)}
    .label{color:var(--pg-muted);font-size:12px}
    .amount{font-size:27px;line-height:1.4;font-weight:550;letter-spacing:-.7px;margin:8px 0 4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .detail{color:var(--pg-muted);font-size:11px;line-height:1.6}
    /* Section menu: one card, one row per section, chevron rotates on open. */
    .sections{margin-top:20px;background:var(--pg-surface);border:1px solid var(--pg-border);border-radius:var(--pg-radius);box-shadow:var(--pg-shadow);overflow:hidden}
    .sections>details{margin:0;border:0}.sections>details+details{border-top:1px solid var(--pg-border)}
    summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:15px 18px;font-size:13px;font-weight:550;color:var(--pg-text);transition:background 140ms ease}
    summary::-webkit-details-marker{display:none}
    summary::before{content:'';flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);opacity:.5;transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 140ms ease}
    details[open]>summary::before{transform:rotate(45deg);opacity:.85}
    summary:hover{background:var(--pg-hover)}
    summary:focus-visible{outline:2px solid var(--pg-accent);outline-offset:-2px}
    details>.grid,details>.panel{padding:2px 18px 22px}
    .panel{min-width:0;border:0;background:transparent;padding:0}
    .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:0}
    input,select,button{background:var(--pg-surface-2);color:var(--pg-text);border:1px solid var(--pg-border-strong);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;min-height:30px}
    input[type=number]{width:110px}
    button{cursor:pointer;transition:background 120ms ease,border-color 120ms ease,filter 120ms ease,opacity 120ms ease}
    button:hover{background:var(--pg-hover)}
    button:disabled{opacity:.5;cursor:default}
    button[type=submit]{background:var(--pg-accent);border-color:transparent;color:#fff;font-weight:550;padding-inline:14px}
    button[type=submit]:hover{filter:brightness(1.08)}
    #refresh,#refresh-balance{background:transparent}
    #delete-price{background:transparent;color:var(--pg-danger)}
    #delete-price:hover{background:var(--pg-hover)}
    input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pg-accent);outline-offset:1px}
    label{display:flex;align-items:center;gap:8px;margin:10px 0}
    .notice{min-height:21px;color:var(--pg-warn);font-size:12px}.notice:empty{display:none}
    .price-pointer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
    #open-model-prices{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--pg-accent);font-weight:550;border-color:var(--pg-border-strong)}
    #open-model-prices::after{content:'→';transition:transform 140ms ease}
    #open-model-prices:hover{background:var(--pg-hover)}
    #open-model-prices:hover::after{transform:translateX(2px)}
    #status{margin-bottom:12px;font-size:12px}
    #price-route{min-width:0;max-width:100%;flex:1}
    table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
    th,td{padding:10px 8px;border-bottom:1px solid var(--pg-border);text-align:right;font-size:12px}
    th:first-child,td:first-child{text-align:left;overflow-wrap:anywhere}
    th{color:var(--pg-muted);font-weight:500;font-size:11px}
    tr:last-child td{border-bottom:0}
    .scope{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .scope label{margin:0;gap:10px;flex-wrap:wrap}
    .scope>span{font-size:13px;color:var(--pg-muted)}
    .heatmap-controls{display:flex;align-items:center;font-size:12px;color:var(--pg-muted)}
    .heatmap-controls>div{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--pg-surface-2);border:1px solid var(--pg-border)}
    .heatmap-controls button{border:0;min-height:26px;padding:3px 12px;border-radius:7px;background:transparent;color:inherit;font-size:12px}
    .heatmap-controls button[aria-pressed=true]{color:var(--pg-text);background:var(--pg-selected);box-shadow:0 1px 2px rgba(16,24,40,.14)}
    .scope .period-total{margin-left:8px}
    #budget-overview{margin:6px 0 2px}
    .bar{height:8px;background:var(--pg-surface-2);border-radius:8px;overflow:hidden;margin:10px 0}
    .fill{height:100%;background:var(--pg-accent);border-radius:8px;max-width:100%}
    fieldset{border:1px solid var(--pg-border);border-radius:12px;padding:8px 12px 12px;margin:10px 0}
    fieldset legend{padding:0 6px;font-size:11px;color:var(--pg-muted)}
    fieldset label{margin:6px 0}fieldset.price-tier{margin:10px 0 0}
    .price-table th,.price-table td{padding:6px 8px;vertical-align:middle}
    .price-table td:first-child{white-space:nowrap}
    .price-edit{border:0;background:transparent;color:var(--pg-accent);cursor:pointer;padding:2px 4px;font:inherit;font-size:12px;min-height:0}
    .price-edit:hover{background:transparent;text-decoration:underline}
    .price-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.price-row label{margin:0}
    .price-rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.price-rates label{margin:0}
    .price-actions{display:flex;gap:8px;margin-top:10px}.price-toggle{margin:0 0 10px}
    .balance{margin:0}.balance-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .balance-heading h2{margin:0;font-size:13px}.balance .notice{margin-top:12px;font-size:12px}
    [hidden]{display:none!important}
    #session-insight{margin-top:20px}#session-insight:empty{display:none}
    html[data-dsh-app-embedded="true"] main>header{display:none}
    @media(max-width:620px){main,html[data-dsh-app-embedded="true"] main{padding:20px 16px}.card{padding:16px 12px}.amount{font-size:21px}.scope{gap:8px}.scope>span{display:none}table{display:block;overflow:auto}label{flex-wrap:wrap}}
  </style>
</head>
<body>
<main>
  <header><h1 data-i18n="title"></h1><span class="spacer"></span><a href="/" data-i18n="back"></a></header>
  <div class="scope"><span data-i18n="allSessions"></span><label><span data-i18n="period"></span><div class="heatmap-controls"><div role="group" data-i18n-aria="period"><button type="button" id="heatmap-today" data-i18n="today" aria-pressed="true"></button><button type="button" id="heatmap-week" data-i18n="week" aria-pressed="false"></button><button type="button" id="heatmap-month" data-i18n="month" aria-pressed="false"></button></div></div><div class="heatmap-controls period-total"><div role="group" data-i18n-aria="all"><button type="button" id="heatmap-all" data-i18n="all" aria-pressed="false"></button></div></div><button type="button" id="refresh" data-i18n="refresh"></button></label></div>
  <div id="status" class="notice" role="status" data-i18n="loading"></div>
  <p class="detail price-pointer"><span data-i18n="priceElsewhere"></span><button type="button" id="open-model-prices" data-i18n="openModelPrices"></button></p>
  <section class="cards" data-i18n-aria="overview">
    <div class="card"><div class="label" data-i18n="cost"></div><div class="amount" id="usage-cost">—</div><div class="detail" id="usage-cost-detail"></div></div>
    <div class="card"><div class="label" data-i18n="tokens"></div><div class="amount" id="usage-tokens">—</div><div class="detail" id="usage-token-detail"></div></div>
    <div class="card"><div class="label" data-i18n="calls"></div><div class="amount" id="usage-calls">—</div><div class="detail" data-i18n="usageScope"></div></div>
  </section>
  <div id="budget-overview"><p class="label"><span id="budget-scope"></span> · <span id="budget-label"></span></p><div class="bar"><div class="fill" id="budget-fill"></div></div></div>
  <div id="session-insight"></div>
  <div class="sections">
  <details><summary data-i18n="accountDetails"></summary><section class="panel balance"><div class="balance-heading"><h2 data-i18n="balanceTitle"></h2><button type="button" id="refresh-balance" data-i18n="balanceRefresh"></button></div>
    <p id="balance-status" class="notice" role="status" data-i18n="balanceLoading"></p>
    <table><thead><tr><th data-i18n="currency"></th><th data-i18n="balanceTotal"></th><th data-i18n="balanceGranted"></th><th data-i18n="balanceTopup"></th></tr></thead><tbody id="balances"></tbody></table>
    <p class="detail" data-i18n="balanceNote"></p></section></details>
  <details><summary data-i18n="details"></summary><div class="grid">
    <section class="panel"><h2 data-i18n="daily"></h2><table><thead><tr><th data-i18n="date"></th><th data-i18n="calls"></th><th data-i18n="input"></th><th data-i18n="cache"></th><th data-i18n="output"></th><th data-i18n="cost"></th></tr></thead><tbody id="days"></tbody></table></section>
    <section class="panel"><h2 data-i18n="modelCosts"></h2><table><thead><tr><th data-i18n="model"></th><th data-i18n="calls"></th><th data-i18n="cost"></th></tr></thead><tbody id="models"></tbody></table></section>
    <section class="panel"><h2 data-i18n="todaySessions"></h2><table><thead><tr><th data-i18n="session"></th><th data-i18n="calls"></th><th data-i18n="cost"></th></tr></thead><tbody id="sessions"></tbody></table></section>
    <section class="panel"><h2 data-i18n="historyTitle"></h2><p id="history" class="muted"></p><p class="detail" data-i18n="historyNote"></p></section>
  </div></details>
  <details><summary data-i18n="budgetAndDisplay"></summary><div class="grid">
    <section class="panel"><h2 data-i18n="budgetAndDisplay"></h2>
      <form id="settings"><label><input type="checkbox" id="budget-enabled"> <span data-i18n="enableBudget"></span></label><label><span data-i18n="period"></span> <select id="budget-period"><option value="day" data-i18n="everyDay"></option><option value="month" data-i18n="everyMonth"></option></select></label>
        <label><span data-i18n="budgetAmount"></span> <input type="number" id="budget-amount" min="0" step="0.01"></label><label><span data-i18n="currency"></span> <select id="currency"><option value="USD">USD</option><option value="CNY">CNY</option></select></label>
        <label><span data-i18n="exchangeRate"></span> <input type="number" id="exchange-rate" min="0.0001" step="0.0001"></label><button type="submit" data-i18n="save"></button></form>
      <p class="detail" data-i18n="estimateNote"></p></section>
  </div></details>
  </div>
</main>
<script src="/dsh-app/cost-ui.js" defer></script>
</body>
</html>
